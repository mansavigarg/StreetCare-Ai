services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: streetcare-ai-backend:latest
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8081
    expose:
      - "8081"
    volumes:
      - streetcare_database:/app/database
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/docs', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: streetcare-ai-frontend:latest
    env_file:
      - .env
    environment:
      API_BASE_URL: http://backend:8081
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    restart: unless-stopped

volumes:
  streetcare_database:
