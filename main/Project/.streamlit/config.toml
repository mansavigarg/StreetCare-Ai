[theme]
base = "light"
primaryColor = "#0f5c63"
backgroundColor = "#f4f7f6"
secondaryBackgroundColor = "#e3ecea"
textColor = "#14211f"
borderColor = "#cbd9d6"
dataframeHeaderBackgroundColor = "#d6e4e1"
showWidgetBorder = true
baseRadius = "medium"
buttonRadius = "medium"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "1.5rem"
redColor = "#b91c1c"
orangeColor = "#b45309"
yellowColor = "#a16207"
greenColor = "#15803d"
blueColor = "#0369a1"
violetColor = "#6d28d9"

[theme.sidebar]
backgroundColor = "#dde8e5"
secondaryBackgroundColor = "#cfdeda"
textColor = "#14211f"
borderColor = "#bccfca"
primaryColor = "#0b474d"

[server]
port = 8080
address = "0.0.0.0"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
