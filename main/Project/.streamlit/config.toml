[theme]
base = "light"
primaryColor = "#2f6b5a"
backgroundColor = "#f4f6f4"
secondaryBackgroundColor = "#eef2ef"
textColor = "#17211d"
borderColor = "#dbe3de"
dataframeHeaderBackgroundColor = "#eef3f0"
showWidgetBorder = true
baseRadius = "large"
buttonRadius = "medium"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "1.75rem"
redColor = "#b42318"
orangeColor = "#b45309"
yellowColor = "#a16207"
greenColor = "#1f6b3f"
blueColor = "#1d5fa8"
violetColor = "#5b3cc4"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f5f3"
textColor = "#17211d"
borderColor = "#e2e8e4"
primaryColor = "#2f6b5a"

[server]
port = 8080
address = "0.0.0.0"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
